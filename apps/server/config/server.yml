configVersion: 1

server:
  host: 127.0.0.1
  port: 3000
  logger: true
  limits:
    bodyBytes: 65536
    messageBytes: 65536
    queuedMessages: 64
    queuedBytes: 1048576
    pendingSendBytes: 1048576
    connections: 128

database:
  path: openvoxel.sqlite
  busyTimeoutMilliseconds: 2000
  queueCapacity: 64
  maxRows: 262144
  maxResultBytes: 67108864
