server:
  host: 127.0.0.1
  port: 3000
  logger: true
  cors:
    allowedOrigins:
      - http://127.0.0.1:5173
      - http://localhost:5173
      - http://127.0.0.1:4173
      - http://localhost:4173
  limits:
    bodyBytes: 65536
    messageBytes: 65536
    queuedMessages: 64
    queuedBytes: 1048576
    pendingSendBytes: 1048576
    connections: 128
    concurrentRequests: 256
    sessionDrainMilliseconds: 5000

database:
  path: openvoxel.sqlite
  busyTimeoutMilliseconds: 2000
  queueCapacity: 64
  maxRows: 262144
  maxResultBytes: 67108864

# Content Pack 是构建后的 JSON 产物。这里仅决定服务器安装哪些产物，以及新世界
# 在未显式选择时启用哪些 owner；人工 YAML 仍留在各 Mod 源目录中。
content:
  packArtifacts: []
  defaultPacks: []

worldRuntime:
  # 完整世界上下文包含注册表、生成器和热状态；空闲世界按 LRU 自动卸载。
  activeWorldCapacity: 64
  # 只缓存玩家修改的稀疏 Chunk；固定地形始终由种子按需生成。
  activeChunkCapacity: 2048
  # 同时限制稀疏覆盖总数，避免少量被完全改写的 Chunk 占用无界内存。
  activeOverrideCapacity: 262144
