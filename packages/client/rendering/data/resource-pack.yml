formatVersion: 3
owner: openvoxel

sources:
  - {key: survivalcraft-blocks, file: sources/survivalcraft-blocks.webp, role: block-albedo-atlas}
  - {key: openworld-clouds, file: sources/openworld-clouds.webp, role: environment-cloud-layer}

atlas:
  tileSize: 32
  padding: 2
  columns: 8

environment:
  clouds: sources/openworld-clouds.webp

models:
  - {key: openvoxel:model/block/cube, kind: cube}
  - {key: openvoxel:model/block/column, kind: column}
  - {key: openvoxel:model/block/cross, kind: cross}
  - {key: openvoxel:model/block/cactus, kind: cactus}
  - {key: openvoxel:model/block/snow_layer, kind: snow_layer}
  - {key: openvoxel:model/block/fluid, kind: fluid}

materials:
  - {key: openvoxel:material/terrain, alpha: 1, alphaCutoff: 0, doubleSided: false, emissive: 0, roughness: 0.9, specular: 0.12}
  - {key: openvoxel:material/metal, alpha: 1, alphaCutoff: 0, doubleSided: false, emissive: 0.04, roughness: 0.38, specular: 0.82}
  - {key: openvoxel:material/leaves, alpha: 1, alphaCutoff: 0.45, doubleSided: false, emissive: 0.02, roughness: 0.82, specular: 0.06}
  - {key: openvoxel:material/cross, alpha: 1, alphaCutoff: 0.45, doubleSided: true, emissive: 0.1, roughness: 0.88, specular: 0.04}
  - {key: openvoxel:material/model, alpha: 1, alphaCutoff: 0.45, doubleSided: true, emissive: 0, roughness: 0.74, specular: 0.08}
  - {key: openvoxel:material/water, alpha: 0.68, alphaCutoff: 0, doubleSided: true, emissive: 0.02, roughness: 0.16, specular: 0.96}
  - {key: openvoxel:material/magma, alpha: 0.92, alphaCutoff: 0, doubleSided: true, emissive: 0.78, roughness: 0.5, specular: 0.28}
  - {key: openvoxel:material/ice, alpha: 0.72, alphaCutoff: 0, doubleSided: false, emissive: 0.03, roughness: 0.2, specular: 0.78}

tints:
  - {key: openvoxel:tint/biome_foliage, red: 0.48, green: 0.9, blue: 0.34}
  - {key: openvoxel:tint/biome_grass, red: 0.5, green: 0.92, blue: 0.34}
  - {key: openvoxel:tint/biome_grass_top, red: 0.54, green: 0.96, blue: 0.38}
  - {key: openvoxel:tint/biome_water, red: 0.62, green: 0.82, blue: 1}

animations:
  - {key: openvoxel:animation/water, frameDurationMs: 240, frames: [openvoxel:texture/block/water, openvoxel:texture/block/water_flow]}
  - {key: openvoxel:animation/magma, frameDurationMs: 320, frames: [openvoxel:texture/block/magma, openvoxel:texture/block/magma_flow]}

textures:
  - {key: openvoxel:texture/block/basalt, weight: 5, sheet: sources/survivalcraft-blocks.webp, column: 6, row: 0, columns: 16, rows: 16, normalStrength: 1.4, variants: [{weight: 1, layers: [{file: textures/basalt.png, opacity: 0.12}]}, {weight: 1, layers: [{file: textures/basalt.png, opacity: 0.24}]}]}
  - {key: openvoxel:texture/block/birch_leaves, file: textures/birch_leaves.png, normalStrength: 0.45}
  - {key: openvoxel:texture/block/birch_log_side, sheet: sources/survivalcraft-blocks.webp, column: 5, row: 7, columns: 16, rows: 16, normalStrength: 1}
  - {key: openvoxel:texture/block/birch_log_top, file: textures/birch_log_top.png, normalStrength: 1}
