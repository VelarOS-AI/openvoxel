formatVersion: 5
owner: openvoxel

textureCatalogs:
  - textures/terrain.yml
  - textures/vegetation.yml
  - textures/fluid.yml

texturePipeline:
  tileSize: 32
  atlasPadding: 4
  maximumAtlasColumns: 8
  mipmaps: true

environment:
  clouds: environment/clouds.webp

surfaceProfiles:
  - {key: rock, normalStrength: 1.35, occlusionStrength: 0.28, roughness: 0.88, roughnessVariation: 0.1, metallic: 0, metallicVariation: 0, emissive: 0, emissiveThreshold: 1}
  - {key: soil, normalStrength: 0.85, occlusionStrength: 0.2, roughness: 0.94, roughnessVariation: 0.06, metallic: 0, metallicVariation: 0, emissive: 0, emissiveThreshold: 1}
  - {key: mineral, normalStrength: 1.45, occlusionStrength: 0.3, roughness: 0.78, roughnessVariation: 0.14, metallic: 0.02, metallicVariation: 0.12, emissive: 0, emissiveThreshold: 1}
  - {key: metallic-mineral, normalStrength: 1.5, occlusionStrength: 0.32, roughness: 0.62, roughnessVariation: 0.22, metallic: 0.04, metallicVariation: 0.92, emissive: 0, emissiveThreshold: 1}
  - {key: wood, normalStrength: 1.05, occlusionStrength: 0.22, roughness: 0.86, roughnessVariation: 0.08, metallic: 0, metallicVariation: 0, emissive: 0, emissiveThreshold: 1}
  - {key: foliage, normalStrength: 0.42, occlusionStrength: 0.12, roughness: 0.84, roughnessVariation: 0.08, metallic: 0, metallicVariation: 0, emissive: 0, emissiveThreshold: 1}
  - {key: plant, normalStrength: 0.24, occlusionStrength: 0.08, roughness: 0.9, roughnessVariation: 0.06, metallic: 0, metallicVariation: 0, emissive: 0, emissiveThreshold: 1}
  - {key: cactus, normalStrength: 0.7, occlusionStrength: 0.18, roughness: 0.82, roughnessVariation: 0.08, metallic: 0, metallicVariation: 0, emissive: 0, emissiveThreshold: 1}
  - {key: snow, normalStrength: 0.22, occlusionStrength: 0.06, roughness: 0.8, roughnessVariation: 0.1, metallic: 0, metallicVariation: 0, emissive: 0, emissiveThreshold: 1}
  - {key: ice, normalStrength: 0.3, occlusionStrength: 0.04, roughness: 0.12, roughnessVariation: 0.08, metallic: 0, metallicVariation: 0, emissive: 0, emissiveThreshold: 1}
  - {key: water, normalStrength: 0.52, occlusionStrength: 0.02, roughness: 0.08, roughnessVariation: 0.04, metallic: 0, metallicVariation: 0, emissive: 0.02, emissiveThreshold: 0.72}
  - {key: magma, normalStrength: 0.62, occlusionStrength: 0.2, roughness: 0.4, roughnessVariation: 0.18, metallic: 0.02, metallicVariation: 0.08, emissive: 1, emissiveThreshold: 0.18}

models:
  - {key: openvoxel:model/block/cube, kind: cube}
  - {key: openvoxel:model/block/column, kind: column}
  - {key: openvoxel:model/block/cross, kind: cross}
  - {key: openvoxel:model/block/cactus, kind: cactus}
  - {key: openvoxel:model/block/snow_layer, kind: snow_layer}
  - {key: openvoxel:model/block/fluid, kind: fluid}

materials:
  - {key: openvoxel:material/terrain, alpha: 1, alphaCutoff: 0, doubleSided: false, castsShadows: true, environmentIntensity: 0.9, clearCoat: 0, clearCoatRoughness: 0, unlit: false}
  - {key: openvoxel:material/metal, alpha: 1, alphaCutoff: 0, doubleSided: false, castsShadows: true, environmentIntensity: 1.15, clearCoat: 0.08, clearCoatRoughness: 0.2, unlit: false}
  - {key: openvoxel:material/leaves, alpha: 1, alphaCutoff: 0.45, doubleSided: false, castsShadows: true, environmentIntensity: 0.75, clearCoat: 0, clearCoatRoughness: 0, unlit: false}
  - {key: openvoxel:material/cross, alpha: 1, alphaCutoff: 0.45, doubleSided: true, castsShadows: false, environmentIntensity: 0.72, clearCoat: 0, clearCoatRoughness: 0, unlit: false}
  - {key: openvoxel:material/model, alpha: 1, alphaCutoff: 0.45, doubleSided: true, castsShadows: true, environmentIntensity: 0.85, clearCoat: 0, clearCoatRoughness: 0, unlit: false}
  - {key: openvoxel:material/water, alpha: 0.68, alphaCutoff: 0, doubleSided: true, castsShadows: false, environmentIntensity: 1.35, clearCoat: 0.72, clearCoatRoughness: 0.06, unlit: false}
  - {key: openvoxel:material/magma, alpha: 0.92, alphaCutoff: 0, doubleSided: true, castsShadows: false, environmentIntensity: 0.35, clearCoat: 0.04, clearCoatRoughness: 0.35, unlit: false}
  - {key: openvoxel:material/ice, alpha: 0.72, alphaCutoff: 0, doubleSided: false, castsShadows: false, environmentIntensity: 1.25, clearCoat: 0.42, clearCoatRoughness: 0.08, unlit: false}

tints:
  - {key: openvoxel:tint/biome_foliage, red: 0.48, green: 0.9, blue: 0.34}
  - {key: openvoxel:tint/biome_grass, red: 0.5, green: 0.92, blue: 0.34}
  - {key: openvoxel:tint/biome_grass_top, red: 0.54, green: 0.96, blue: 0.38}
  - {key: openvoxel:tint/biome_water, red: 0.62, green: 0.82, blue: 1}

animations:
  - {key: openvoxel:animation/water, frameDurationMs: 240, frames: [openvoxel:texture/block/water, openvoxel:texture/block/water_flow]}
  - {key: openvoxel:animation/magma, frameDurationMs: 320, frames: [openvoxel:texture/block/magma, openvoxel:texture/block/magma_flow]}
