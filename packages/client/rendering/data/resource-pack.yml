formatVersion: 1
owner: openvoxel
atlas:
  tileSize: 16
  padding: 1
  columns: 8

models:
  - {key: openvoxel:model/block/cube, kind: cube}
  - {key: openvoxel:model/block/column, kind: column}
  - {key: openvoxel:model/block/cross, kind: cross}
  - {key: openvoxel:model/block/cactus, kind: cactus}
  - {key: openvoxel:model/block/snow_layer, kind: snow_layer}
  - {key: openvoxel:model/block/fluid, kind: fluid}

materials:
  - {key: openvoxel:material/terrain, alpha: 1, alphaCutoff: 0, doubleSided: false, emissive: 0}
  - {key: openvoxel:material/metal, alpha: 1, alphaCutoff: 0, doubleSided: false, emissive: 0.08}
  - {key: openvoxel:material/leaves, alpha: 1, alphaCutoff: 0.45, doubleSided: false, emissive: 0}
  - {key: openvoxel:material/cross, alpha: 1, alphaCutoff: 0.45, doubleSided: true, emissive: 0, unlit: true}
  - {key: openvoxel:material/model, alpha: 1, alphaCutoff: 0.45, doubleSided: true, emissive: 0}
  - {key: openvoxel:material/water, alpha: 0.7, alphaCutoff: 0, doubleSided: true, emissive: 0.04}
  - {key: openvoxel:material/magma, alpha: 0.88, alphaCutoff: 0, doubleSided: true, emissive: 0.72}
  - {key: openvoxel:material/ice, alpha: 0.74, alphaCutoff: 0, doubleSided: false, emissive: 0.06}

tints:
  - {key: openvoxel:tint/biome_foliage, red: 0.64, green: 0.86, blue: 0.52}
  - {key: openvoxel:tint/biome_grass, red: 0.68, green: 0.9, blue: 0.48}
  - {key: openvoxel:tint/biome_grass_top, red: 0.72, green: 0.94, blue: 0.52}
  - {key: openvoxel:tint/biome_water, red: 0.56, green: 0.78, blue: 1}

animations:
  - {key: openvoxel:animation/water, frameDurationMs: 240, frames: [openvoxel:texture/block/water]}
  - {key: openvoxel:animation/magma, frameDurationMs: 320, frames: [openvoxel:texture/block/magma]}

textures:
  - {key: openvoxel:texture/block/basalt, sheet: textures/surface-materials-v2.png, column: 0, row: 2, columns: 4, rows: 4}
  - {key: openvoxel:texture/block/birch_leaves, file: textures/birch_leaves.png}
  - {key: openvoxel:texture/block/birch_log_side, file: textures/birch_log_side.png}
  - {key: openvoxel:texture/block/birch_log_top, file: textures/birch_log_top.png}
