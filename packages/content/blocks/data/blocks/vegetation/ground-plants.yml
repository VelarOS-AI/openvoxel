blocks:
  - key: blocks.tallGrass
    translationKey: translations.block.tallGrass
    tags: [tags.plant, tags.replaceable, tags.flammable]
    properties: []
    defaultState: []
    physics: {collision: {kind: none}, selection: {kind: custom, key: shapes.cross}, occlusion: {kind: none}, replaceable: true, friction: 0.6, speedFactor: 1, jumpFactor: 1}
    light: {emission: 0, opacity: 0, skylight: pass_through, ambientOcclusion: false}
    render: {model: models.block.cross, layer: cutout, material: materials.cross, textures: {all: textures.block.tallGrass}, tint: tints.biomeGrass, cullFaces: false}
    interaction: {breakable: true, hardness: 0, blastResistance: 0, drops: loot.block.tallGrass, sounds: sounds.grass}
    behaviors: [{kind: flammable, ignitionChance: 0.6, spreadChance: 1}, {kind: support, face: below, supportingTag: tags.lushPlantSupport}]
    variants: []

