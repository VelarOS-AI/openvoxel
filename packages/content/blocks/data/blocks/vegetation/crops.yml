  - key: blocks.pumpkin
    translationKey: translations.block.pumpkin
    tags: [tags.plant, tags.flammable]
    properties: [{name: facing, kind: enum, values: [north, east, south, west]}]
    defaultState: [{name: facing, value: north}]
    physics: {collision: {kind: custom, key: shapes.pumpkin, boxes: [{minimumX: 0.125, minimumY: 0, minimumZ: 0.125, maximumX: 0.875, maximumY: 0.65, maximumZ: 0.875}]}, selection: {kind: custom, key: shapes.pumpkin, boxes: [{minimumX: 0.125, minimumY: 0, minimumZ: 0.125, maximumX: 0.875, maximumY: 0.65, maximumZ: 0.875}]}, occlusion: {kind: none}, replaceable: false, friction: 0.6, speedFactor: 1, jumpFactor: 1}
    light: {emission: 0, opacity: 0, skylight: pass_through, ambientOcclusion: false}
    render: {model: models.block.pumpkin, layer: opaque, material: materials.terrain, textures: {top: textures.block.pumpkinTop, bottom: textures.block.pumpkinTop, side: textures.block.pumpkinSide, front: textures.block.pumpkinFront}, cullFaces: false}
    interaction: {breakable: true, hardness: 1, blastResistance: 1, toolTag: tools.axe, drops: loot.block.pumpkin, sounds: sounds.wood}
    behaviors: [{kind: flammable, ignitionChance: 0.3, spreadChance: 0.5}, {kind: placement, strategy: horizontal_facing}, {kind: support, face: below, supportingTag: tags.cropSupport}]
    variants: []

