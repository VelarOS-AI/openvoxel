blocks:
  - key: blocks.rye
    translationKey: translations.block.rye
    tags: [tags.plant, tags.replaceable, tags.flammable]
    properties: [{name: age, kind: integer, minimum: 0, maximum: 7}]
    defaultState: [{name: age, value: 0}]
    physics: {collision: {kind: none}, selection: {kind: custom, key: shapes.cross}, occlusion: {kind: none}, replaceable: true, friction: 0.6, speedFactor: 1, jumpFactor: 1}
    light: {emission: 0, opacity: 0, skylight: pass_through, ambientOcclusion: false}
    render: {model: models.block.cross, layer: cutout, material: materials.cross, textures: {all: textures.block.rye0}, cullFaces: false}
    interaction: {breakable: true, hardness: 0, blastResistance: 0, toolTag: tools.shears, drops: loot.block.rye, sounds: sounds.grass}
    behaviors: [{kind: crop_growth, ageProperty: age, epochsPerStage: 4}, {kind: flammable, ignitionChance: 0.6, spreadChance: 1}, {kind: support, face: below, supportingTag: tags.cropSupport}]
    variants:
      - {when: [{name: age, value: 1}], render: {model: models.block.cross, layer: cutout, material: materials.cross, textures: {all: textures.block.rye1}, cullFaces: false}}
      - {when: [{name: age, value: 2}], render: {model: models.block.cross, layer: cutout, material: materials.cross, textures: {all: textures.block.rye2}, cullFaces: false}}
      - {when: [{name: age, value: 3}], render: {model: models.block.cross, layer: cutout, material: materials.cross, textures: {all: textures.block.rye3}, cullFaces: false}}
