      - {when: [{name: age, value: 5}], render: {model: models.block.cross, layer: cutout, material: materials.cross, textures: {all: textures.block.rye5}, cullFaces: false}}
      - {when: [{name: age, value: 6}], render: {model: models.block.cross, layer: cutout, material: materials.cross, textures: {all: textures.block.rye6}, cullFaces: false}}
      - {when: [{name: age, value: 7}], render: {model: models.block.cross, layer: cutout, material: materials.cross, textures: {all: textures.block.rye7}, cullFaces: false}}

