  - key: blocks.fallenLeaves
    translationKey: translations.block.fallenLeaves
    tags: [tags.plant, tags.replaceable, tags.flammable]
    properties: [{name: layers, kind: integer, minimum: 1, maximum: 4}]
    defaultState: [{name: layers, value: 1}]
    physics:
      collision: {kind: none}
      selection: {kind: custom, key: shapes.groundCover, boxes: [{minimumX: 0, minimumY: 0, minimumZ: 0, maximumX: 1, maximumY: 1, maximumZ: 1, maximumYProperty: layers, maximumYScale: 0.0625}]}
      occlusion: {kind: none}
      replaceable: true
      friction: 0.58
      speedFactor: 0.96
      jumpFactor: 1
    light: {emission: 0, opacity: 0, skylight: pass_through, ambientOcclusion: false}
    render: {model: models.block.groundCover, layer: cutout, material: materials.cross, textures: {all: textures.block.fallenLeaves}, cullFaces: false}
