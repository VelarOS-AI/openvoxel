blocks:
  - key: blocks.oakLog
    translationKey: translations.block.oakLog
    tags: [tags.wood, tags.flammable, tags.snowSupport, tags.vineSupport]
    properties: [{name: axis, kind: enum, values: [x, y, z]}]
    defaultState: [{name: axis, value: y}]
    physics: {collision: {kind: full_cube}, selection: {kind: full_cube}, occlusion: {kind: full_cube}, replaceable: false, friction: 0.6, speedFactor: 1, jumpFactor: 1}
    light: {emission: 0, opacity: 15, skylight: blocked, ambientOcclusion: true}
    render: {model: models.block.column, layer: opaque, material: materials.terrain, textures: {top: textures.block.oakLogTop, bottom: textures.block.oakLogTop, side: textures.block.oakLogSide}, cullFaces: true}
    interaction: {breakable: true, hardness: 2, blastResistance: 2, toolTag: tools.axe, drops: loot.block.oakLog, sounds: sounds.wood}
    behaviors: [{kind: flammable, ignitionChance: 0.05, spreadChance: 0.05}, {kind: placement, strategy: axis_from_face}]
    variants: []

  - key: blocks.oakLeaves
    translationKey: translations.block.oakLeaves
    tags: [tags.leaves, tags.flammable, tags.snowSupport]
    properties:
      - {name: distance, kind: integer, minimum: 1, maximum: 7}
      - {name: persistent, kind: boolean}
    defaultState: [{name: distance, value: 7}, {name: persistent, value: false}]
    physics: {collision: {kind: full_cube}, selection: {kind: full_cube}, occlusion: {kind: none}, replaceable: false, friction: 0.6, speedFactor: 1, jumpFactor: 1}
    light: {emission: 0, opacity: 1, skylight: diffuse, ambientOcclusion: false}
    render: {model: models.block.cube, layer: cutout, material: materials.leaves, textures: {all: textures.block.oakLeaves}, tint: tints.deciduousFoliage, cullFaces: true}
    interaction: {breakable: true, hardness: 0.2, blastResistance: 0.2, toolTag: tools.shears, drops: loot.block.oakLeaves, sounds: sounds.leaves}
    behaviors: [{kind: flammable, ignitionChance: 0.3, spreadChance: 0.6}, {kind: random_tick, handler: handlers.leafDecay}]
    variants: []

