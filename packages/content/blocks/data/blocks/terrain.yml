blocks:
  - key: blocks.air
    translationKey: translations.block.air
    tags: [tags.replaceable]
    properties: []
    defaultState: []
    physics:
      collision: {kind: none}
      selection: {kind: none}
      occlusion: {kind: none}
      replaceable: true
      friction: 0
      speedFactor: 1
      jumpFactor: 1
    light: {emission: 0, opacity: 0, skylight: pass_through, ambientOcclusion: false}
    render: {model: null, cullFaces: false}
    interaction: {breakable: false, hardness: 0, blastResistance: 0, drops: loot.empty, sounds: sounds.silent}
    behaviors: []
    variants: []

  - key: blocks.grass
    translationKey: translations.block.grass
    tags: [tags.terrain, tags.soil, tags.plantSupport]
    properties: [{name: snowy, kind: boolean}]
    defaultState: [{name: snowy, value: false}]
    physics:
      collision: {kind: full_cube}
      selection: {kind: full_cube}
      occlusion: {kind: full_cube}
      replaceable: false
      friction: 0.6
      speedFactor: 1
      jumpFactor: 1
    light: {emission: 0, opacity: 15, skylight: blocked, ambientOcclusion: true}
    render:
      model: models.block.cube
      layer: opaque
      material: materials.terrain
      textures: {top: textures.block.grassTop, bottom: textures.block.dirt, side: textures.block.grassSide}
      tint: tints.biomeGrassTop
      cullFaces: true
    interaction: {breakable: true, hardness: 0.6, blastResistance: 0.6, toolTag: tools.shovel, drops: loot.block.grass, sounds: sounds.grass}
    behaviors: []
    variants: []

