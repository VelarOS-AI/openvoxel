    light: {emission: 0, opacity: 15, skylight: blocked, ambientOcclusion: true}
    render: {model: models.block.cube, layer: opaque, material: materials.terrain, textures: {all: textures.block.dirt}, cullFaces: true}
    interaction: {breakable: true, hardness: 0.5, blastResistance: 0.5, toolTag: tools.shovel, drops: loot.block.dirt, sounds: sounds.gravel}
